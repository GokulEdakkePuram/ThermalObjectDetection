# Shared defaults. Every experiment inherits from here via `extends: base`, so
# an ablation config only states the lines that actually differ.
model: yolo11s.pt
data: configs/data/flir_agc.yaml
device: auto
seed: 0
workers: 8
patience: 20

# Thermal frames are 640x512, so imgsz 640 is native rather than a choice. The
# visible frames are larger and get downscaled to the same input, which is
# fixed budget rather than an oversight -- a deployed detector has one. Both
# spectra end up with objects of near-identical apparent size at 640; the
# measurement is in docs/03.
imgsz: 640
epochs: 60

train_args:
  optimizer: auto
  cos_lr: true
  # Mosaic pays off here for the usual reason (more objects per step) and one
  # thermal-specific one: it composites four frames with different absolute
  # temperatures into one canvas, which stops the model keying on a frame-wide
  # brightness offset. Closing it for the last epochs removes the domain gap
  # between augmented training images and clean validation images.
  mosaic: 1.0
  close_mosaic: 10
  # A dashcam has a canonical "up" and a mirror-symmetric world, so horizontal
  # flips are free and vertical flips would invent scenes that never occur.
  fliplr: 0.5
  flipud: 0.0
  # Hue and saturation jitter do nothing on a single-channel sensor replicated
  # to three channels -- there is only a grey axis to shift. They are off here
  # rather than at the Ultralytics defaults, where they cost dataloader time
  # for no effect.
  #
  # They stay off for the RGB arm too, which is a deliberate handicap: the
  # modality comparison is only single-variable if the augmentation is the
  # same on both sides. See docs/03.
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.4
  degrees: 0.0
  scale: 0.5
  plots: true
